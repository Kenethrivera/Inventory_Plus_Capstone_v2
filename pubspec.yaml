name: inventory_plus
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  ultralytics_yolo:
  emailjs: ^4.0.0  # Official YOLO plugin for Flutter
  camera: ^0.11.0
  lucide_icons_flutter: ^3.1.12
  mobile_scanner: ^5.1.0
  shared_preferences: ^2.2.2
  supabase_flutter: ^2.0.0
  image_picker: ^1.0.7
  flutter_dotenv: ^6.0.1
  pdf: ^3.12.0
  printing: ^5.14.3
  fl_chart: ^1.2.0
  shelf: ^1.4.2
  shelf_static: ^1.1.3
  image: ^4.1.7
  google_generative_ai: ^0.4.3
  qr_flutter: ^4.1.0
  flutter_litert: ^3.8.0
  path_provider: ^2.1.4
  http: ^1.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  msix: ^3.18.0

flutter:
  uses-material-design: true
  assets:
    - lib/.env
    - assets/models/best.tflite
    - assets/models/best_v1.2.tflite
    - assets/models/labels.txt

msix_config:
  display_name: Inventory Plus
  publisher_display_name: Async Co.
  identity_name: com.inventoryplus.app
  msix_version: 1.0.0.0 
  description: Smart Inventory System for SME Hardware Shops
  # logo_path: assets/logo.png 
  capabilities: internetClient # Required so Supabase can connect to the internet