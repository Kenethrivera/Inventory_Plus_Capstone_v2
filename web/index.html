<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="inventory_plus">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <script defer src="https://github.com/corbado/flutter-passkeys/releases/download/2.4.0/bundle.js"></script>

  <title>Inventory Plus</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #f4f6f8;
    }

    .app-loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: #0f172a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app-loading__content {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .app-loading__mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: #2563eb;
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.22);
    }

    .app-loading__title {
      margin: 0 0 3px;
      font-size: 18px;
      font-weight: 700;
    }

    .app-loading__status {
      margin: 0;
      color: #64748b;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="app-loading" class="app-loading" role="status" aria-live="polite">
    <div class="app-loading__content">
      <div class="app-loading__mark" aria-hidden="true">I+</div>
      <div>
        <p class="app-loading__title">Inventory Plus</p>
        <p id="app-loading-status" class="app-loading__status">Restoring your session&hellip;</p>
      </div>
    </div>
  </div>
  <script src="flutter_bootstrap.js" defer></script>
</body>
</html>
